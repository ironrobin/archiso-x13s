title      Arch Linux install medium (aarch64, UEFI, stubble efi)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz.efi
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% audit=0 efi=noruntime pd_ignore_unused clk_ignore_unused arm64.nopauth systemd.mask=tpm2.target
